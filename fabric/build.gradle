
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

configurations {
    compatibilityMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // Development-only compatibility coverage; Iris 1.10.7 requires Sodium 0.8.12 or earlier.
    compatibilityMods "maven.modrinth:AANobbMI:NFkjnzWE" // Sodium
    compatibilityMods "maven.modrinth:PtjYWJkn:zmsIDdn6" // Sodium Extra
    compatibilityMods "maven.modrinth:gvQqBUqZ:Ow7wA0kG" // Lithium
    compatibilityMods "maven.modrinth:YL57xq9U:fDpuVzVr" // Iris
    compatibilityMods "maven.modrinth:5ZwdcRci:4EwhsTu7" // ImmediatelyFast
    compatibilityMods "maven.modrinth:NNAgCjsB:CFBkR8Vm" // Entity Culling

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "org.ow2.asm:asm-tree:9.10.1"

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    modImplementation "maven.modrinth:konkrete:1.9.14-1.21.11-fabric"
    modImplementation "maven.modrinth:modmenu:17.0.0-beta.1"

}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("../run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    // Allow builds when there are test sources but no matching tests.
    failOnNoDiscoveredTests = false
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Modrinth's Maven metadata does not list jar-in-jar libraries. Loom removes nested jars while
// remapping, so explicitly remap those dependencies too (Iris parsers, ImmediatelyFast Reflect,
// and Entity Culling's helper mods). Everything stays development-only and outside our artifact.
def compatibilityJars = new LinkedHashSet<File>()
def collectCompatibilityJars
collectCompatibilityJars = { File jar ->
    if (compatibilityJars.add(jar)) {
        zipTree(jar).matching { include 'META-INF/jars/*.jar' }.files.each { collectCompatibilityJars(it) }
    }
}
configurations.compatibilityMods.files.each { collectCompatibilityJars(it) }
dependencies {
    compatibilityJars.each { modLocalRuntime files(it) }
}

// Exercise the release artifact too: development mappings can hide a missing Mixin refmap.
tasks.named("test", Test) {
    dependsOn tasks.named("remapJar")
    systemProperty "justzoom.releaseJar", tasks.named("remapJar").get().archiveFile.get().asFile.absolutePath
}
