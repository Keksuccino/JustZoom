
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

dependencies {
    // Development-only compatibility coverage; these mods are not bundled with Just Zoom.
    runtimeOnly "maven.modrinth:AANobbMI:bAZQdGpg" // Sodium
    runtimeOnly "maven.modrinth:PtjYWJkn:te2y9qZn" // Sodium Extra
    runtimeOnly "maven.modrinth:gvQqBUqZ:xS0Q8LSi" // Lithium
    runtimeOnly "maven.modrinth:YL57xq9U:bAdKrpw8" // Iris
    runtimeOnly "maven.modrinth:5ZwdcRci:3MP9UR23" // ImmediatelyFast
    runtimeOnly "maven.modrinth:NNAgCjsB:F4loCvYt" // Entity Culling


    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    implementation "maven.modrinth:konkrete:${konkrete_version}-${minecraft_version}-fabric"
    implementation "maven.modrinth:modmenu:${modmenu_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "org.ow2.asm:asm-tree:${asm_version}"

}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("../run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}
